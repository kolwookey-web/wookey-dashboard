name: Update Data (harian 12:00 WIB)
on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC = 12:00 WIB
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build data
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python pipeline.py
      - name: Commit if changed
        run: |
          git config user.name "wookey-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json
          git commit -m "auto: update data $(date -u +%FT%TZ)" || echo "no changes"
          git push
